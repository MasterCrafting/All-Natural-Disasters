name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Buscar la carpeta del proyecto
        run: |
          echo "=== Archivos del repositorio ==="
          find . -not -path './.git/*' -type f | head -80
          if [ -z "$(find . -name settings.gradle -not -path './.git/*' | head -1)" ]; then
            for z in $(find . -name '*.zip' -not -path './.git/*'); do echo "Descomprimiendo $z"; mkdir -p _zip && unzip -oq "$z" -d _zip; done
          fi
          F=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then echo "ERROR: no se encontro settings.gradle en el repositorio. Sube TODOS los archivos del proyecto."; exit 1; fi
          echo "Encontrado: $F"
          echo "DIR=$(dirname "$F")" >> "$GITHUB_ENV"
      - name: Compilar
        run: cd "$DIR" && gradle build --no-daemon
      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: ${{ env.DIR }}/build/libs/*.jar
